{% extends "base.html" %}
{% block title %}Admin login — Dragon Vault{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-mark"><img src="{{ url_for('static', filename='logo.svg') }}" alt=""></div>
  <span class="eyebrow">PRIVATE WORKSPACE</span>
  <h1>Welcome back.</h1>
  <p class="auth-intro">Sign in to manage your web assets and publish new experiences.</p>
  <form class="form-card auth-form" method="post" action="{{ url_for('admin_login', next=request.args.get('next', '')) }}">
    <label>Email address<input type="email" name="email" value="{{ email|default('') }}" autocomplete="username" required placeholder="admin@example.com"></label>
    <label>Password<div class="password-wrap"><input id="password" type="password" name="password" autocomplete="current-password" required placeholder="Enter password"><button class="password-toggle" type="button" data-toggle-password="password">Show</button></div></label>
    <button class="button primary wide" type="submit">Continue <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <a class="back-link" href="{{ url_for('home') }}"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back to Dragon Vault</a>
</section>
{% endblock %}
